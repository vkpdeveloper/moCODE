name: mecode
description: "A new Flutter project."
repository: https://github.com/vkpdeveloper/moCODE
homepage: https://github.com/vkpdeveloper/moCODE
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.10.0-290.4.beta

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.4.0
  riverpod_annotation: ^2.4.0
  dio: ^5.7.0
  go_router: ^14.8.1
  shared_preferences: ^2.3.4
  google_fonts: ^6.2.1
  flutter_markdown: ^0.7.7
  uuid: ^4.5.1
  intl: ^0.19.0
  shimmer: ^3.0.0
  simple_icons: ^14.6.1
  image_picker: ^1.1.2
  firebase_core: ^3.15.2
  firebase_auth: ^5.6.3
  google_sign_in: ^7.2.0
  flutter_dotenv: ^5.2.1
  url_launcher: ^6.3.2
  webview_flutter: ^4.9.0
  crimson: ^0.4.0+1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.14
  json_annotation: ^4.9.0
  json_serializable: ^6.9.0
  flutter_launcher_icons: ^0.14.4
  change_app_package_name: ^1.5.0

dependency_overrides:
  analyzer: 6.4.1

flutter:
  uses-material-design: true
  assets:
    - .dev.env
    - .prod.env

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/app_icon.png"
  min_sdk_android: 21
